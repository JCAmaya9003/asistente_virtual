# Levanta el contenedor de entrenamiento con acceso a la GPU.
#
# Los volúmenes montan TU carpeta wakeword/ dentro del contenedor: las muestras que
# grabaste entran, y el modelo .onnx entrenado sale, sin copiar nada a mano.
#
# El caché de HuggingFace se persiste en un volumen: los ~4 GB de datos de entrenamiento
# se bajan UNA vez, no en cada corrida.

services:
  entrenador:
    build: .
    image: wakeword-trainer:cuda118
    container_name: wakeword-trainer
    stdin_open: true
    tty: true
    working_dir: /work
    volumes:
      - ../:/work/wakeword          # muestras de entrada, modelo de salida
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf-cache:
