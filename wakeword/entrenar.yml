# Configuración del wake word.
#
# OJO CON EL TEXTO: se pasa por espeak-ng para generar las voces sintéticas. Escribimos
# "Raftalia" (como se pronuncia), NO "Raphtalia": si no, las miles de muestras sintéticas
# sonarían a algo que nadie dice.

model_name: raftalia

# Variantes del nombre. Se alternan al generar, para cubrir distintas pronunciaciones.
target_phrase:
  - "Raftalia"
  - "Raftalia."
  - "Raftalia?"          # entonación de pregunta: cambia la prosodia

# Frases parecidas que NO deben disparar. Son las que causan los falsos positivos:
# el modelo necesita verlas explícitamente marcadas como negativas.
custom_negative_phrases:
  - "Rafa"
  - "Rafael"
  - "Natalia"
  - "Italia"
  - "batalla"
  - "raspa"
  - "raptar"
  - "Talia"
  - "gramática"
  - "falta"
  - "falla"
  - "ravioli"

# Habla general en español. SIN ESTO EL DETECTOR DISPARA CON CUALQUIER CONVERSACIÓN:
# el modelo necesita aprender cómo suena el español que NO es el wake word.
negative_speech:
  - "Hoy hace bastante calor en la ciudad"
  - "¿Podés pasarme el vaso de agua, por favor?"
  - "El partido empieza a las ocho de la noche"
  - "Necesito terminar el informe antes del viernes"
  - "Vamos a comer algo cuando salgamos de la clase"
  - "No me acuerdo dónde dejé las llaves del carro"
  - "Mañana tengo que levantarme temprano"
  - "La reunión se pasó para la semana que viene"
  - "Me gusta mucho esa canción que pusieron"
  - "Todavía no he revisado el correo de la universidad"
  - "El código no compila porque falta una librería"
  - "Creo que deberíamos hablarlo con calma"
  - "Se cortó la luz en todo el barrio"
  - "Voy a salir un rato a caminar"
  - "¿Cuánto cuesta el pasaje hasta el centro?"
  - "Ese examen estuvo más difícil de lo que esperaba"

# Voces de Piper para generar las muestras sintéticas (rutas relativas a la raíz).
# MÁS VOCES = MÁS VARIEDAD = MEJOR MODELO. Descargalas con:
#   python -m piper.download_voices es_MX-ald-medium es_ES-davefx-medium \
#       es_ES-sharvard-medium es_AR-daniela-high --download-dir voices
voces:
  - voices/es_MX-ald-medium.onnx
  - voices/es_ES-davefx-medium.onnx
  - voices/es_ES-sharvard-medium.onnx
  - voices/es_AR-daniela-high.onnx

# --- entrenamiento (dentro de Docker) ---
# batch_size BAJO A PROPÓSITO: con 4 GB de VRAM (RTX 3050) uno grande revienta.
batch_size: 8
steps: 50000
max_negative_weight: 1500
target_accuracy: 0.7
target_recall: 0.5

augmentation_rounds: 2

output_dir: /work/wakeword/modelos
