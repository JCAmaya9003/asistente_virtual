# Configuración del oído. Se usa en:  python main.py --voz   y   python main.py --daemon

stt:
  modelo: "large-v3"      # large-v3 con GPU; "small" o "base" si vas a CPU
  device: "auto"          # auto | cuda | cpu   (auto: usa CUDA y cae a CPU si falla)
  compute_type: "auto"    # auto | int8_float16 | float16 | int8
  idioma: "es"            # fijo a propósito: la autodetección falla en clips cortos

captura:
  sample_rate: 16000      # lo que espera Whisper. No cambiar.
  bloque_ms: 100
  silencio_ms: 1200       # (modo --voz) silencio que da por terminada la frase
  umbral_silencio: 0.015  # (modo --voz) subilo si tu micro capta mucho ruido
  max_segundos: 15        # tope duro de grabación

# Modo residente (v3): vive en la bandeja y responde al hotkey global.
daemon:
  tecla: "ctrl_r"         # mantenela presionada para hablar
                          # opciones: ctrl_r, ctrl_l, alt_r, f9, f10, pause, scroll_lock
  max_segundos: 30        # tope de una sola grabación con la tecla presionada
  watchdog_s: 30          # cada cuánto se verifica que el micrófono siga vivo
  latido_s: 300           # cada cuánto se escribe un latido en el audit log
  gracia_s: 300           # tras un comando, Whisper sigue en VRAM 5 min por si hablás de nuevo

# Wake word (v4). Si el modelo no existe, el asistente funciona igual con el hotkey.
# Se entrena con Docker: ver wakeword/README.md
wakeword:
  modelo: "wakeword/modelos/raftalia.onnx"
  umbral: 0.5             # ↑ menos falsos positivos, ↓ más sensible. Ajustá esto, no reentrenes.
  refractario_s: 2.0      # tras despertar, ignora detecciones por N segundos
